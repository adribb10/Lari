<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Para Laritza ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ease-ios:cubic-bezier(0.22,1,0.36,1)}
body{font-family:'Poppins',sans-serif;background:#0f0f1a;color:white;overflow:hidden}

body::before{
 content:"";position:fixed;width:200%;height:200%;
 background: radial-gradient(circle at 30% 20%, #ff4b91, transparent 40%), radial-gradient(circle at 80% 70%, #7b61ff, transparent 40%);
 filter: blur(120px);animation: float 12s var(--ease-ios) infinite;
}
@keyframes float{0%{transform:translate(0,0)}50%{transform:translate(-10%,-10%)}100%{transform:translate(0,0)}}

header{text-align:center;padding:15px;font-size:1.4rem}
.container{position:relative;width:100vw;height:calc(100vh - 100px);overflow:hidden}
.section{position:absolute;width:100%;height:100%;padding:15px;text-align:center;top:0;left:100%;opacity:0;transform:scale(0.96);transition:.6s var(--ease-ios)}
.section.active{left:0;opacity:1;transform:scale(1)}
.section.exit{left:-100%;opacity:0}

.card{margin:10px auto;width:90%;padding:15px;border-radius:20px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);cursor:pointer;transition:.3s}
.card:hover{transform:scale(1.05)}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center;text-align:center;padding:20px}
.modal-content{background:rgba(255,255,255,0.1);padding:25px;border-radius:20px;font-size:1.1rem;animation:zoom .4s var(--ease-ios)}
@keyframes zoom{from{transform:scale(0.7);opacity:0}to{transform:scale(1);opacity:1}}

.paper{background:#fffaf0;color:#333;padding:20px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.3);font-family:serif;line-height:1.5}

.timeline{margin-top:20px;display:flex;flex-direction:column;gap:20px}
.timeline-item{background:rgba(255,255,255,0.08);padding:15px;border-radius:15px;cursor:pointer;transition:.3s}
.timeline-item:hover{transform:scale(1.03)}
.timeline-item strong{color:#ff7eb3}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}
.grid img{width:100%;height:100px;object-fit:cover;border-radius:10px}

.tabbar{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;padding:8px;background:rgba(20,20,40,0.7);backdrop-filter:blur(25px);z-index:999}
.tabbar button{background:none;border:none;color:white;font-size:0.7rem}

.player{margin-top:20px;padding:15px;border-radius:20px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px)}
.progress{width:100%;height:5px;background:rgba(255,255,255,0.2);border-radius:5px;margin:10px 0}
.progress div{height:100%;width:0%;background:#ff4b91}
.controls{display:flex;justify-content:center;gap:15px}

.daily{margin-top:15px;font-size:0.95rem;opacity:0.8}

</style>
</head>
<body>

<header>Laritza ❤️</header>

<div class="container" id="container">

<div id="inicio" class="section active">
<h2>Hola mi amor ❤️</h2>
<p id="mensajeDia"></p>
<div id="contador"></div>
<p class="daily" id="mensajeUnico"></p>
<button class="card" onclick="mensajeEspecial()">❤️ Tócame</button>
</div>

<div id="mensajes" class="section">
<h2>Para ti 💌</h2>
<div id="listaMensajes"></div>
</div>

<div id="fotos" class="section">
<h2>Nosotros ❤️</h2>

<div class="grid" id="galeria">
    
</div>
</div>

<div id="timeline" class="section">
<h2>Nuestra historia ❤️</h2>
<div class="timeline" id="timeline"></div>
</div>

<div id="carta" class="section">
<h2>Carta 💌</h2>
<div class="paper">
Laritza, desde el 13 de abril mi vida cambió completamente.<br><br>
No importa la distancia, siempre estás en mi mente.<br>
Eres mi paz, mi alegría y mi lugar favorito.<br><br>
Te amo muchísimo ❤️
</div>
</div>

<div id="musica" class="section">
<h2>Nuestras canciones 🎶</h2>
<audio id="audio"></audio>
<div class="player">
<div id="songTitle"></div>
<div class="progress"><div id="progressBar"></div></div>
<div class="controls">
<button onclick="prevSong()">⏮</button>
<button onclick="togglePlay()">⏯</button>
<button onclick="nextSong()">⏭</button>
</div>
</div>
</div>

</div>

<div class="tabbar">
<button onclick="showSection('inicio')">Inicio</button>
<button onclick="showSection('mensajes')">💌</button>
<button onclick="showSection('fotos')">📸</button>
<button onclick="showSection('timeline')">⏳</button>
<button onclick="showSection('musica')">🎵</button>
</div>

<div class="modal" id="modal" onclick="cerrarModal()">
<div class="modal-content" id="modalText"></div>
</div>

<script>
let sections=['inicio','mensajes','fotos','timeline','carta','musica'];
let currentIndex=0;

function showSection(id){
 const newIndex=sections.indexOf(id);
 if(newIndex===currentIndex) return;
 const current=document.getElementById(sections[currentIndex]);
 const next=document.getElementById(id);
 current.classList.remove('active');
 current.classList.add('exit');
 next.classList.add('active');
 setTimeout(()=>current.classList.remove('exit'),600);
 currentIndex=newIndex;
}

/* MENSAJES */
const mensajes=[
"Laritza, desde el 13 de abril mi vida cambió completamente.No importa la distancia, siempre estás en mi mente.Eres mi paz, mi alegría y mi lugar favorito.Te amo muchísimo ❤️",
"No sabes la tranquilidad que me da saber que estás en mi vida… porque incluso en los días difíciles, pensar en ti me hace sentir que todo va a estar bien.❤️",
"Aunque no pueda abrazarte ahora, hay algo en mi que te siente cerca todo el tiempo… como si de alguna forma nunca estuviéramos separados"
];
const lista=document.getElementById('listaMensajes');
mensajes.forEach(m=>{
 const div=document.createElement('div');
 div.className='card';
 div.innerText=m;
 div.onclick=()=>abrirModal(m);
 lista.appendChild(div);
});

function abrirModal(texto, imagen=null){
 let contenido = `<p>${texto}</p>`;
 if(imagen){contenido = `<img src="${imagen}" style="width:100%;border-radius:10px;margin-bottom:10px">`+contenido}
 document.getElementById('modalText').innerHTML=contenido;
 document.getElementById('modal').style.display='flex';
}
function cerrarModal(){document.getElementById('modal').style.display='none'}

/* MENSAJE DIARIO */
const mensajesUnicos=[
"Hoy también te elijo ❤️",
"Si estás aquí, es porque te estoy pensando",
"Eres mi pensamiento favorito del día",
"Laritza, siempre tú"
];
document.getElementById('mensajeUnico').innerText=mensajesUnicos[new Date().getDate()%mensajesUnicos.length];

function mensajeEspecial(){
 abrirModal("Si tocaste esto… es porque también me estás pensando ❤️");
}
function mensajeFotosDinamico(){
 const inicio=new Date('2026-04-13');
 const hoy=new Date();
 const dias=Math.floor((hoy - inicio)/86400000);

 let mensaje="📸 Aquí comenzarán nuestros recuerdos... ❤️";

 if(dias>=3 && dias<10){
  mensaje="📸 Ya quiero nuestra primera foto juntos... ❤️";
 }
 else if(dias>=10 && dias<30){
  mensaje="📸 Este espacio ya necesita una historia nuestra 😏❤️";
 }
 else if(dias>=30){
  mensaje="📸 Ya deberíamos tener recuerdos aquí... pero pronto ❤️";
 }

 const el=document.getElementById('emptyMessage');
 if(el) el.innerText=mensaje;
}

mensajeFotosDinamico();
/* TIMELINE */
const eventos=[
 {fecha:'13 Abril 2025',texto:'Nuestro inicio ❤️'},
 {fecha:'Primeras flores 💐',texto:'El día que te di tus primeras flores… la distancia nunca será impedimento ❤️',imagen:'fotos/flor1.jpg'}
];

const tl=document.getElementById('timeline');
eventos.forEach(e=>{
 const item=document.createElement('div');
 item.className='timeline-item';
 item.innerHTML=`<strong>${e.fecha}</strong><br>${e.texto}`;
 item.onclick=()=>abrirModal(e.texto,e.imagen);
 tl.appendChild(item);
});

/* MUSICA */
const playlist=['es_verdad.mp3','sone.mp3'];
let currentSong=0;let isPlaying=false;
function loadSong(){
 document.getElementById('audio').src=playlist[currentSong];
 document.getElementById('songTitle').innerText='Canción '+(currentSong+1);
}
function togglePlay(){
 const audio=document.getElementById('audio');
 if(!isPlaying){audio.play();isPlaying=true}else{audio.pause();isPlaying=false}
}
function nextSong(){
 currentSong=(currentSong+1)%playlist.length;
 loadSong();

 if(isPlaying){
  document.getElementById('audio').play();
 }
}

function prevSong(){
 currentSong=(currentSong-1+playlist.length)%playlist.length;
 loadSong();

 if(isPlaying){
  document.getElementById('audio').play();
 }
}
function prevSong(){currentSong=(currentSong-1+playlist.length)%playlist.length;loadSong();togglePlay()}

setInterval(()=>{
 const audio=document.getElementById('audio');
 if(audio.duration){
  document.getElementById('progressBar').style.width=(audio.currentTime/audio.duration)*100+'%';
 }
},500);

/* CONTADOR */
const inicio=new Date('2026-04-13');
setInterval(()=>{
 const d=new Date()-inicio;
 const dias=Math.floor(d/86400000);
 document.getElementById('contador').innerText=`${dias} días juntos ❤️`;
},1000);

loadSong();
</script>

</body>
</html>
